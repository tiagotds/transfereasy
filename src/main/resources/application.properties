# Default configuration. Every key can be overridden by a system property with the same name
# (-Dhttp.port=9090) or by an environment variable in UPPER_SNAKE_CASE (HTTP_PORT=9090).
# Precedence: system property > environment variable > this file.

# HTTP edge
http.port=8080
http.max-body-bytes=65536
# Bulkhead: at most this many requests are processed at once; the rest wait up to 'acquire-timeout' for a slot
# and are then refused with 503 + Retry-After, instead of piling up on the database pool. /health is exempt.
http.max-in-flight=64
http.acquire-timeout=200ms
http.retry-after=1s

# Embedded database
db.pool-size=32
db.lock-timeout=10s

# Statements (GET /api/accounts/{number}/statement?limit=n)
statement.default-size=100
statement.max-size=1000

# Money movements: the largest single deposit / withdrawal / transfer accepted
money.max-amount=1000000000000.00

# Retry of operations that lost a race (optimistic conflict, deadlock, lock timeout).
# Each attempt is a fresh transaction; pauses use exponential backoff with full jitter.
retry.max-attempts=10
retry.initial-backoff=2ms
retry.max-backoff=100ms

# How accounts are protected while a movement changes them:
#   PESSIMISTIC - SELECT ... FOR UPDATE in id order: competitors wait in line, conflicts never happen.
#   OPTIMISTIC  - plain read + version compare-and-set on write: no waiting, losers are retried.
account.locking=PESSIMISTIC
