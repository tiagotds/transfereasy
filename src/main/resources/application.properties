# Default configuration. Every key can be overridden by a system property with the same name
# (-Dhttp.port=9090) or by an environment variable in UPPER_SNAKE_CASE (HTTP_PORT=9090).
# Precedence: system property > environment variable > this file.

# HTTP edge
http.port=8080
http.max-body-bytes=65536

# Embedded database
db.pool-size=32
db.lock-timeout=10s

# Statements (GET /api/accounts/{number}/statement?limit=n)
statement.default-size=100
statement.max-size=1000

# Money movements: the largest single deposit / withdrawal / transfer accepted
money.max-amount=1000000000000.00
