services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      DB_POOL_SIZE: "32"

  # Black-box acceptance tests against the running container.
  # Run with:  docker compose --profile test up --build --exit-code-from smoke-test
  smoke-test:
    profiles: ["test"]
    image: curlimages/curl:8.10.1
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
    volumes:
      - ./scripts/smoke-test.sh:/smoke-test.sh:ro
    entrypoint: ["/bin/sh", "/smoke-test.sh"]
